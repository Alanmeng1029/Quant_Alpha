[package]
name = "quant-backtest"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "quant-backtest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
duckdb = { version = "1.4", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
