[package]
name = "quant-sequence-cache"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "quant-sequence-cache"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "59"
clap = { version = "4", features = ["derive"] }
parquet = { version = "59", features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
