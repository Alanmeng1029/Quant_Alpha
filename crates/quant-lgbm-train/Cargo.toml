[package]
name = "quant-lgbm-train"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[[bin]]
name = "quant-lgbm-predict-day"
path = "src/bin/predict_day.rs"

[[bin]]
name = "quant-position-day"
path = "src/bin/position_day.rs"

[[bin]]
name = "quant-production"
path = "src/bin/production.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
duckdb = { version = "1.4", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
