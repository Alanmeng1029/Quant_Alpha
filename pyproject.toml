[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-data-lake"
version = "0.1.0"
description = "Local A-share minute-data lake and aggregated daily-bar tooling"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5",
  "lightgbm==4.6.0",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "numba>=0.60",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "reportlab>=5.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
deep-learning = ["torch>=2.14,<2.15"]

[project.scripts]
a-share-data = "a_share_data.cli:main"
quant-factor = "a_share_data.factors:main"
quant-factor-store = "a_share_data.factor_store:main"
quant-report = "a_share_data.report:main"
quant-batch = "a_share_data.batch:main"
quant-predict = "a_share_data.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
